name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  check-version:
    name: Cargo.toml matches tag
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify Cargo.toml version matches the pushed tag
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION=$(grep -m1 '^version' Cargo.toml | sed -E 's/version = "(.*)"/\1/')
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag v$TAG_VERSION does not match Cargo.toml version $CARGO_VERSION -- bump Cargo.toml before tagging"
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: check-version
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          NAME=dox-${{ github.ref_name }}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/dox dist/dox
          cp README.md dist/README.md
          cp LICENSE dist/LICENSE
          tar czf $NAME.tar.gz -C dist .
          shasum -a 256 $NAME.tar.gz | tee $NAME.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dox-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dox-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true

  update-tap:
    name: Bump homebrew-dox formula
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Clone tap
        run: |
          git clone "https://x-access-token:${{ secrets.HOMEBREW_TAP_TOKEN }}@github.com/pkumar2026/homebrew-dox.git" "$RUNNER_TEMP/homebrew-dox"
          git -C "$RUNNER_TEMP/homebrew-dox" config user.name "github-actions[bot]"
          git -C "$RUNNER_TEMP/homebrew-dox" config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump formula to this release
        env:
          DOX_TAP_DIR: ${{ runner.temp }}/homebrew-dox
          DOX_REPO: pkumar2026/dox
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: scripts/bump-formula.sh "${GITHUB_REF_NAME#v}"
