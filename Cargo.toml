[package]
name = "dox"
version = "0.2.1"
edition = "2021"
rust-version = "1.93"
description = "A focused Docker TUI for colima — lazydocker, but smaller."
license = "MIT"

[[bin]]
name = "dox"
path = "src/main.rs"

[dependencies]
ratatui = "0.30"
crossterm = { version = "0.29", features = ["event-stream"] }
bollard = "0.21"
tokio = { version = "1.52", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
futures-util = "0.3"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
thiserror = "2.0"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
arboard = { version = "3.6", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "1.1"
dirs = "6.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }

[dev-dependencies]
insta = "1.43"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
