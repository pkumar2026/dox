name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
          - target: x86_64-apple-darwin
            runner: macos-15-intel
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        run: |
          rustup update stable
          rustup target add ${{ matrix.target }}

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-${{ matrix.target }}-${{ hashFiles('Cargo.lock') }}

      - name: Build release
        run: cargo build --release --locked --target ${{ matrix.target }}

      - name: Package
        run: |
          mkdir -p dist
          NAME=dox-${{ github.ref_name }}-${{ matrix.target }}
          cp target/${{ matrix.target }}/release/dox dist/dox
          cp README.md dist/README.md
          cp LICENSE dist/LICENSE
          tar czf $NAME.tar.gz -C dist .
          shasum -a 256 $NAME.tar.gz | tee $NAME.tar.gz.sha256

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dox-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            dox-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256
          fail_on_unmatched_files: true
          generate_release_notes: true
